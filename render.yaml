services:
  - type: web
    name: subscription-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: the per-visitor rate limit is kept in memory.
    startCommand: gunicorn --chdir src app:app --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in the Render dashboard
      - key: APP_USERNAME
        sync: false          # the login name
      - key: APP_PASSWORD_HASH
        sync: false          # generate with the command in README.md (Login section)
      - key: SECRET_KEY
        sync: false          # any long random string; keep it stable
      - key: WRITE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_SUBSCRIPTIONS
        value: "200"

  # Sends renewal reminder emails every hour. Each email goes out in the hour and time zone its
  # subscription was set with (new ones default to 9am). Subscriptions saved before that keep
  # 13:00 UTC, which is 2pm in Lagos and 8am Eastern in winter. Needs DATABASE_URL: the web
  # service's local JSON file isn't visible to this job.
  - type: cron
    name: subscription-reminders
    runtime: python
    plan: starter
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python src/reminders.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false          # same Neon connection string as the web service
      - key: GMAIL_ADDRESS
        sync: false          # the Gmail address that sends the reminders
      - key: GMAIL_APP_PASSWORD
        sync: false          # a Gmail app password, not your normal password
      - key: REMINDER_TO
        sync: false          # optional: where reminders go; defaults to GMAIL_ADDRESS
