<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subscription Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #fff; color: #000; }
    header { padding: 22px 32px; background: #000; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header form { margin: 0; }
    .container { max-width: 720px; margin: 24px auto; padding: 0 24px; }
    .card { background: #fff; border: 1px solid #000; border-radius: 10px; padding: 22px; margin-bottom: 20px; }
    .card h2 { margin-top: 0; font-size: 16px; color: #000; font-weight: 700; }
    .stat-row { display: flex; gap: 16px; margin-bottom: 8px; }
    .stat-box { flex: 1; background: #F2F2F2; border-radius: 8px; padding: 14px; text-align: center; }
    .stat-box .value { font-size: 22px; font-weight: 700; color: #000; }
    .stat-box .label { font-size: 11px; color: #000; font-weight: 600; margin-top: 4px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    input, select { padding: 9px; border: 1px solid #000; border-radius: 6px; font-size: 13px; font-weight: 600; color: #000; flex: 1; min-width: 120px; background: #fff; }
    button { padding: 9px 16px; border: 1px solid #000; border-radius: 6px; background: #000; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    button:hover { background: #333; }
    button.secondary { background: #fff; color: #000; border: 1px solid #000; }
    button.secondary:hover { background: #F2F2F2; }
    button.danger { background: #000; color: #fff; border: 1px solid #000; }
    .sub-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #000; font-size: 13px; }
    .sub-name { font-weight: 700; color: #000; }
    .sub-meta { color: #000; font-weight: 600; font-size: 12px; }
    .soon-flag { background: #fff; border: 1px solid #000; color: #000; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; margin-left: 8px; white-space: nowrap; }
    .cancelled { opacity: 0.45; }
    .error-box { background: #fff; border: 1px solid #000; color: #000; font-weight: 700; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
    .actions { display: flex; gap: 8px; }
    @media (max-width: 520px) {
      .sub-row { flex-wrap: wrap; gap: 8px; }
      .actions { flex-wrap: wrap; }
    }
    .reminder-form { padding: 14px 0 16px; border-bottom: 1px solid #000; }
    .reminder-field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .reminder-field { flex: 1; min-width: 180px; }
    .reminder-field input, .reminder-field select { width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Subscription Tracker</h1>
    <form method="post" action="/logout">
      <button type="submit" class="secondary">Log out</button>
    </form>
  </header>
  <div class="container">

    <div class="card">
      <h2>Overview</h2>
      <div class="stat-row" id="statRow">
        <div class="stat-box"><div class="value">-</div><div class="label">Monthly total</div></div>
        <div class="stat-box"><div class="value">-</div><div class="label">Yearly total</div></div>
        <div class="stat-box"><div class="value">-</div><div class="label">Active</div></div>
      </div>
      <div id="upcomingList"></div>
    </div>

    <div class="card">
      <h2>Add a subscription</h2>
      <div id="formError"></div>
      <div class="form-row">
        <input type="text" id="name" placeholder="Name (e.g. Netflix)" />
        <input type="number" id="amount" placeholder="Amount" step="0.01" />
      </div>
      <div class="form-row">
        <select id="billingCycle">
          <option value="monthly">Monthly</option>
          <option value="weekly">Weekly</option>
          <option value="yearly">Yearly</option>
        </select>
        <input type="date" id="nextRenewal" />
        <input type="text" id="category" placeholder="Category (optional)" />
      </div>
      <div class="form-row">
        <input type="number" id="remindDays" min="0" max="365" placeholder="Email me this many days before renewal (blank = no reminder)" />
        <input type="number" id="remindRepeat" min="1" max="365" placeholder="Then repeat every this many days (blank = send once)" />
      </div>
      <div class="form-row">
        <input type="number" id="sendHour" min="0" max="23" value="9" placeholder="Send hour (0 to 23)" />
        <input type="text" id="timeZone" list="timeZoneOptions" placeholder="Time zone (e.g. Africa/Lagos)" />
      </div>
      <div class="form-row">
        <div class="reminder-field">
          <label for="remindUntil">Stop reminders after (optional)</label>
          <input type="date" id="remindUntil" />
        </div>
      </div>
      <button onclick="addSubscription()">Add</button>
    </div>

    <div class="card">
      <h2>All subscriptions</h2>
      <div id="listError"></div>
      <div id="subList"></div>
    </div>

  </div>

  <datalist id="timeZoneOptions"></datalist>

  <script>
    let subscriptions = [];
    let editingReminderId = null;

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    async function loadDashboard() {
      const res = await fetch('/api/dashboard');
      const data = await res.json();

      const statRow = document.getElementById('statRow');
      statRow.innerHTML = `
        <div class="stat-box"><div class="value">$${data.totals.monthly_total}</div><div class="label">Monthly total</div></div>
        <div class="stat-box"><div class="value">$${data.totals.yearly_total}</div><div class="label">Yearly total</div></div>
        <div class="stat-box"><div class="value">${data.totals.active_count}</div><div class="label">Active</div></div>
      `;

      const upcomingList = document.getElementById('upcomingList');
      if (data.upcoming.length === 0) {
        upcomingList.innerHTML = '<p style="color:#000;font-weight:600;font-size:13px;">Nothing renewing in the next 7 days.</p>';
      } else {
        upcomingList.innerHTML = '<p style="font-size:13px;font-weight:700;margin-top:16px;color:#000;">Renewing soon:</p>' +
          data.upcoming.map((s) => `<div class="sub-row"><span style="font-weight:700;">${esc(s.name)}</span><span class="sub-meta">${esc(s.next_renewal_date)}</span></div>`).join('');
      }
    }

    async function loadSubscriptions() {
      const res = await fetch('/api/subscriptions');
      subscriptions = await res.json();
      renderSubscriptions();
    }

    function renderSubscriptions() {
      const list = document.getElementById('subList');

      if (subscriptions.length === 0) {
        list.innerHTML = '<p style="color:#000;font-weight:600;font-size:13px;">No subscriptions yet.</p>';
        return;
      }

      list.innerHTML = subscriptions.map((s) => `
        <div class="sub-item">
          <div class="sub-row ${s.status === 'cancelled' ? 'cancelled' : ''}">
            <div>
              <span class="sub-name">${esc(s.name)}</span>
              <span class="sub-meta"> - $${esc(s.amount)}/${esc(s.billing_cycle)} - next: ${esc(s.next_renewal_date)}${s.remind_days_before != null ? ` - email ${esc(s.remind_days_before)} day(s) before${s.remind_repeat_days ? `, then every ${esc(s.remind_repeat_days)} day(s)` : ''}, at ${String(s.send_hour ?? 13).padStart(2, '0')}:00 ${esc(s.time_zone || 'UTC')}${s.remind_until ? `, stops after ${esc(s.remind_until)}` : ''}` : ''}</span>
              ${s.status === 'cancelled' ? '<span class="soon-flag">cancelled</span>' : ''}
              ${s.status === 'active' && s.reminders_paused ? '<span class="soon-flag">reminders paused</span>' : ''}
            </div>
            ${s.status === 'active' ? `
              <div class="actions">
                <button class="secondary" onclick="openReminderForm('${esc(s.id)}')">Reminder</button>
                ${s.remind_days_before != null ? (s.reminders_paused
                  ? `<button class="secondary" onclick="resumeReminders('${esc(s.id)}')">Resume reminders</button>`
                  : `<button class="secondary" onclick="pauseReminders('${esc(s.id)}')">Pause reminders</button>`) : ''}
                <button class="secondary" onclick="renewSub('${esc(s.id)}')">Renew</button>
                <button class="danger" onclick="cancelSub('${esc(s.id)}')">Cancel</button>
              </div>
            ` : ''}
          </div>
          ${s.id === editingReminderId ? reminderForm(s) : ''}
        </div>
      `).join('');
    }

    async function addSubscription() {
      const errorBox = document.getElementById('formError');
      errorBox.innerHTML = '';

      const payload = {
        name: document.getElementById('name').value.trim(),
        amount: document.getElementById('amount').value,
        billing_cycle: document.getElementById('billingCycle').value,
        next_renewal_date: document.getElementById('nextRenewal').value,
        category: document.getElementById('category').value.trim(),
        remind_days_before: document.getElementById('remindDays').value,
        remind_repeat_days: document.getElementById('remindRepeat').value,
        send_hour: document.getElementById('sendHour').value,
        time_zone: document.getElementById('timeZone').value.trim(),
        remind_until: document.getElementById('remindUntil').value,
      };

      const res = await fetch('/api/subscriptions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        errorBox.innerHTML = `<div class="error-box">${esc(data.error)}</div>`;
        return;
      }

      document.getElementById('name').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('nextRenewal').value = '';
      document.getElementById('category').value = '';
      document.getElementById('remindDays').value = '';
      document.getElementById('remindRepeat').value = '';
      document.getElementById('remindUntil').value = '';

      loadDashboard();
      loadSubscriptions();
    }

    function reminderForm(s) {
      const id = esc(s.id);
      const hour = s.send_hour ?? 13;
      const hours = Array.from({ length: 24 }, (_, h) =>
        `<option value="${h}"${h === hour ? ' selected' : ''}>${String(h).padStart(2, '0')}:00</option>`).join('');
      return `
        <div class="reminder-form">
          <div id="reminderError-${id}"></div>
          <div class="form-row">
            <div class="reminder-field">
              <label for="reminderDays-${id}">Email me this many days before renewal</label>
              <input type="number" id="reminderDays-${id}" value="${esc(s.remind_days_before ?? '')}" min="0" max="365" placeholder="Blank = no reminder" />
            </div>
            <div class="reminder-field">
              <label for="reminderRepeat-${id}">Then repeat every this many days</label>
              <input type="number" id="reminderRepeat-${id}" value="${esc(s.remind_repeat_days ?? '')}" min="1" max="365" placeholder="Blank = send once" />
            </div>
          </div>
          <div class="form-row">
            <div class="reminder-field">
              <label for="reminderHour-${id}">Send at</label>
              <select id="reminderHour-${id}">${hours}</select>
            </div>
            <div class="reminder-field">
              <label for="reminderZone-${id}">Time zone</label>
              <input type="text" id="reminderZone-${id}" value="${esc(s.time_zone || 'UTC')}" list="timeZoneOptions" placeholder="e.g. Africa/Lagos" />
            </div>
          </div>
          <div class="form-row">
            <div class="reminder-field">
              <label for="reminderUntil-${id}">Stop reminders after (optional)</label>
              <input type="date" id="reminderUntil-${id}" value="${esc(s.remind_until ?? '')}" />
            </div>
          </div>
          <div class="actions">
            <button onclick="saveReminder('${id}')">Save</button>
            <button class="secondary" onclick="closeReminderForm()">Close</button>
            ${s.remind_days_before != null ? `<button class="secondary" onclick="turnOffReminder('${id}')">Turn off reminder</button>` : ''}
          </div>
        </div>
      `;
    }

    function openReminderForm(id) {
      editingReminderId = id;
      renderSubscriptions();
      const firstField = document.getElementById(`reminderDays-${id}`);
      if (firstField && firstField.focus) firstField.focus();
    }

    function closeReminderForm() {
      editingReminderId = null;
      renderSubscriptions();
    }

    function showReminderError(id, message) {
      const box = document.getElementById(`reminderError-${id}`);
      if (box) box.innerHTML = `<div class="error-box">${esc(message)}</div>`;
    }

    // Returns { body } for what is in the form, or { error } with a message for the first problem found.
    function readReminderForm(id) {
      const daysText = document.getElementById(`reminderDays-${id}`).value.trim();
      const repeatText = document.getElementById(`reminderRepeat-${id}`).value.trim();
      const hourText = String(document.getElementById(`reminderHour-${id}`).value).trim();
      const timeZone = document.getElementById(`reminderZone-${id}`).value.trim();
      const untilText = document.getElementById(`reminderUntil-${id}`).value.trim();

      const days = daysText === '' ? null : Number(daysText);
      if (days !== null && (!Number.isInteger(days) || days < 0 || days > 365)) {
        return { error: 'Days before renewal must be a whole number from 0 to 365, or blank for no reminder.' };
      }
      const repeat = repeatText === '' ? null : Number(repeatText);
      if (repeat !== null && (!Number.isInteger(repeat) || repeat < 1 || repeat > 365)) {
        return { error: 'Repeat must be a whole number of days from 1 to 365, or blank to send once.' };
      }
      if (days === null && repeat !== null) {
        return { error: 'Set the days before renewal first, or clear the repeat.' };
      }
      const hour = hourText === '' ? NaN : Number(hourText);
      if (!Number.isInteger(hour) || hour < 0 || hour > 23) {
        return { error: 'Choose an hour from 00:00 to 23:00.' };
      }
      if (timeZone === '') {
        return { error: 'Enter a time zone, such as Africa/Lagos or America/New_York.' };
      }
      if (untilText !== '' && !/^\d{4}-\d{2}-\d{2}$/.test(untilText)) {
        return { error: 'Enter the end date as YYYY-MM-DD, or leave it blank.' };
      }
      if (days === null && untilText !== '') {
        return { error: 'Set the days before renewal first, or clear the end date.' };
      }
      return { body: { days, repeat_days: repeat, send_hour: hour, time_zone: timeZone, until: untilText === '' ? null : untilText } };
    }

    async function saveReminder(id) {
      const { body, error } = readReminderForm(id);
      if (error) {
        showReminderError(id, error);
        return;
      }
      await postReminder(id, body);
    }

    async function turnOffReminder(id) {
      await postReminder(id, { days: null, repeat_days: null });
    }

    async function postReminder(id, body) {
      let res;
      let data = {};
      try {
        res = await fetch(`/api/subscriptions/${id}/reminder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        showReminderError(id, 'Could not reach the server. Try again.');
        return;
      }
      if (!res.ok) {
        showReminderError(id, data.error || 'Could not save the reminder.');
        return;
      }
      editingReminderId = null;
      await loadSubscriptions();
    }

    // Pausing or resuming a subscription's reminders. A problem is shown above the list, since the buttons
    // are in the rows.
    async function changeReminders(id, action) {
      const box = document.getElementById('listError');
      box.innerHTML = '';
      let res;
      let data = {};
      try {
        res = await fetch(`/api/subscriptions/${encodeURIComponent(id)}/${action}`, { method: 'POST' });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        box.innerHTML = '<div class="error-box">Could not reach the server. Try again.</div>';
        return;
      }
      if (!res.ok) {
        box.innerHTML = `<div class="error-box">${esc(data.error || 'Could not change the reminders.')}</div>`;
        return;
      }
      await loadSubscriptions();
    }

    function pauseReminders(id) {
      return changeReminders(id, 'pause');
    }

    function resumeReminders(id) {
      return changeReminders(id, 'resume');
    }

    async function cancelSub(id) {
      await fetch(`/api/subscriptions/${id}/cancel`, { method: 'POST' });
      loadDashboard();
      loadSubscriptions();
    }

    async function renewSub(id) {
      await fetch(`/api/subscriptions/${id}/renew`, { method: 'POST' });
      loadDashboard();
      loadSubscriptions();
    }

    // Suggestions for the time zone boxes. The browser's list leaves out UTC, so it is added here.
    function fillTimeZoneOptions() {
      const zones = typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : [];
      document.getElementById('timeZoneOptions').innerHTML = ['UTC', ...zones.filter((zone) => zone !== 'UTC')]
        .map((zone) => `<option value="${esc(zone)}"></option>`).join('');
    }

    fillTimeZoneOptions();
    document.getElementById('timeZone').value = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    loadDashboard();
    loadSubscriptions();
  </script>
</body>
</html>
