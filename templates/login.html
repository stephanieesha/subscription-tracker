<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in - Subscription Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #fff; color: #000; }
    header { padding: 22px 32px; background: #000; color: #fff; }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .container { max-width: 420px; margin: 48px auto; padding: 0 24px; }
    .card { background: #fff; border: 1px solid #000; border-radius: 10px; padding: 22px; }
    .card h2 { margin-top: 0; font-size: 16px; font-weight: 700; }
    label { display: block; font-size: 12px; font-weight: 700; margin: 12px 0 4px; }
    input { width: 100%; padding: 9px; border: 1px solid #000; border-radius: 6px; font-size: 13px; font-weight: 600; color: #000; background: #fff; }
    button { margin-top: 18px; width: 100%; padding: 9px 16px; border: 1px solid #000; border-radius: 6px; background: #000; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    button:hover { background: #333; }
    .error-box { background: #fff; border: 1px solid #000; color: #000; font-weight: 700; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header><h1>Subscription Tracker</h1></header>
  <div class="container">
    <div class="card">
      <h2>Log in</h2>
      {% if error %}
        <div class="error-box">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <button type="submit">Log in</button>
      </form>
    </div>
  </div>
</body>
</html>
